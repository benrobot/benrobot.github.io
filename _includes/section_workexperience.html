<section class="panel" aria-labelledby="experience-heading">
	<h2 id="experience-heading">Work Experience</h2>
	<ol class="roles">
		{% for role in site.data.resume.roles %}
		<li class="role">
			<header class="role-header">
				<h3 class="role-title">{{ role.title }}</h3>
				<p class="role-dates">{{ role.start }} – {{ role.end }}</p>
				<p class="role-where">{{ role.employer }}<span class="role-kind">{{ role.employer_description }}</span></p>
			</header>
			<ul>
				{% for item in role.description %}
				<li>{{ item }}</li>
				{% endfor %}
			</ul>
		</li>
		{% endfor %}
	</ol>
</section>
