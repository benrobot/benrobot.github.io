{% if site.data.resume.training %}
<section id="coursesBubble" class="panel" aria-labelledby="training-heading">
	<h2 id="training-heading">Training</h2>
	<ul class="course-list">
		{% for course in site.data.resume.training.courses %}
		<li>
			{% if course.link %}
			<a target="_blank" rel="noopener noreferrer" href="{{ course.link }}">{{ course.title }}</a>
			{% else %}
			<strong>{{ course.title }}</strong>
			{% endif %}
			<span class="course-date">{{ course.date }}</span>
		</li>
		{% endfor %}
	</ul>
</section>
{% endif %}
