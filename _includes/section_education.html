<section class="panel" aria-labelledby="education-heading">
	<h2 id="education-heading">Education</h2>
	<ul class="facts">
		{% for edu in site.data.resume.education %}
		<li>
			<strong>{{ edu.level }}, {{ edu.subject }}</strong>
			<span>{{ edu.school }} · {{ edu.date }}</span>
		</li>
		{% endfor %}
	</ul>
</section>
