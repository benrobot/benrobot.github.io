{% if site.data.resume.github %}
<section class="panel" aria-labelledby="projects-heading">
	<h2 id="projects-heading">Projects</h2>
	<div class="project-grid">
		{% for project in site.data.resume.github %}
		<div class="github-widget" data-repo="{{ project }}"></div>
		{% endfor %}
	</div>
</section>
{% endif %}
