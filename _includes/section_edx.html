{% if site.data.resume.edx %}
<section id="edxBubble" class="panel" aria-labelledby="edx-heading">
	<h2 id="edx-heading">edX {% if site.data.resume.edx.profileurl %}(<a target="_blank" rel="noopener noreferrer" href="{{ site.data.resume.edx.profileurl }}">view profile</a>){% endif %}</h2>
	<ul class="course-list">
		{% for course in site.data.resume.edx.courses %}
		<li>
			{% if course.link %}
			<a target="_blank" rel="noopener noreferrer" href="{{ course.link }}">{{ course.title }}</a>
			{% else %}
			<strong>{{ course.title }}</strong>
			{% endif %}
			<span class="course-date">{{ course.date }}</span>
		</li>
		{% endfor %}
	</ul>
</section>
{% endif %}
