<head>
	{% if site.ga_tracking_id %}
	<!-- Global site tag (gtag.js) - Google Analytics -->
	<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.ga_tracking_id }}"></script>
	<script>
	  window.dataLayer = window.dataLayer || [];
	  function gtag(){dataLayer.push(arguments);}
	  gtag('js', new Date());

	  gtag('config', '{{ site.ga_tracking_id }}');
	</script>
	{% endif %}
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>{{ site.title | escape }}</title>

	<link rel="apple-touch-icon" sizes="180x180" href="{{ '/img/apple-touch-icon.png' | relative_url }}">
	<link rel="icon" type="image/png" sizes="32x32" href="{{ '/img/favicon-32x32.png' | relative_url }}">
	<link rel="icon" type="image/png" sizes="16x16" href="{{ '/img/favicon-16x16.png' | relative_url }}">
	<link rel="manifest" href="{{ '/img/site.webmanifest' | relative_url }}">
	<link rel="mask-icon" href="{{ '/img/safari-pinned-tab.svg' | relative_url }}" color="#5bbad5">
	<link rel="shortcut icon" href="{{ '/img/favicon.ico' | relative_url }}">
	<meta name="msapplication-TileColor" content="#00aba9">
	<meta name="msapplication-config" content="{{ '/img/browserconfig.xml' | relative_url }}">
	<meta name="theme-color" content="#ffffff">

	<!--  WebFonts  -->
	<link href="{{ '/css/css' | relative_url }}" rel="stylesheet" type="text/css">

	<!-- Twitter Bootstrap CSS -->
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css" integrity="sha384-1q8mTJOASx8j1Au+a5WDVnPi2lkFfwwEAa8hDDdjZlpLegxhjVME1fgjWPGmkzs7" crossorigin="anonymous">

	<!-- Core StyleSheet -->
	<link rel="stylesheet" type="text/css" href="{{ '/css/main_style.css' | relative_url }}">
	<link rel="stylesheet" type="text/css" href="{{ '/css/bootstrap-override.css' | relative_url }}">
</head>
