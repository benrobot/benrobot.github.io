<head>
	<script>
		(function () {
			try {
				var theme = localStorage.getItem("theme");
				if (theme === "light" || theme === "dark") {
					document.documentElement.setAttribute("data-theme", theme);
				}
			} catch (e) {}
		})();
	</script>
	{% if site.ga_tracking_id %}
	<!-- Google tag (gtag.js) -->
	<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.ga_tracking_id }}"></script>
	<script>
	  window.dataLayer = window.dataLayer || [];
	  function gtag(){dataLayer.push(arguments);}
	  gtag('js', new Date());

	  gtag('config', '{{ site.ga_tracking_id }}');
	</script>
	{% endif %}
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Benjamin Roedell, solution architect in Tampa, FL. Application development, cloud infrastructure, security, and delivery automation.">

	<title>{{ site.title | escape }}</title>

	<link rel="apple-touch-icon" sizes="180x180" href="{{ '/img/apple-touch-icon.png' | relative_url }}">
	<link rel="icon" type="image/png" sizes="32x32" href="{{ '/img/favicon-32x32.png' | relative_url }}">
	<link rel="icon" type="image/png" sizes="16x16" href="{{ '/img/favicon-16x16.png' | relative_url }}">
	<link rel="manifest" href="{{ '/img/site.webmanifest' | relative_url }}">
	<link rel="mask-icon" href="{{ '/img/safari-pinned-tab.svg' | relative_url }}" color="#1f4b6e">
	<link rel="shortcut icon" href="{{ '/img/favicon.ico' | relative_url }}">
	<meta name="msapplication-TileColor" content="#17212b">
	<meta name="msapplication-config" content="{{ '/img/browserconfig.xml' | relative_url }}">
	<meta name="theme-color" content="#17212b" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#0d1218" media="(prefers-color-scheme: dark)">

	<link rel="stylesheet" type="text/css" href="{{ '/css/main_style.css' | relative_url }}">
</head>
