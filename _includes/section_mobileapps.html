{% if site.data.resume.apps %}
<section class="panel" aria-labelledby="apps-heading">
	<h2 id="apps-heading">Mobile Portfolio</h2>
	<table class="app-table">
		<thead>
			<tr>
				<th>App Name</th>
				<th>Platform</th>
				<th>Link</th>
				<th>Description</th>
			</tr>
		</thead>
		<tbody>
			{% for app in site.data.resume.apps %}
			<tr>
				<td>{{ app.name }}</td>
				<td>{{ app.platform }}</td>
				<td><a target="_blank" rel="noopener noreferrer" href="{{ app.url }}">App store</a></td>
				<td>{{ app.description }}</td>
			</tr>
			{% endfor %}
		</tbody>
	</table>
</section>
{% endif %}
