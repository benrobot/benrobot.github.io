{% if site.data.resume.stackoverflow %}
<section class="panel" aria-labelledby="stackoverflow-heading">
	<h2 id="stackoverflow-heading">Stack Overflow</h2>
	<div class="flair" id="stackScore">
		<a target="_blank" rel="noopener noreferrer" href="{{ site.data.resume.stackoverflow.profileurl }}">
			<img src="{{ site.data.resume.stackoverflow.flairimageurl }}" width="208" height="58"
				alt="Benjamin Roedell on Stack Overflow">
		</a>
	</div>
</section>
{% endif %}
