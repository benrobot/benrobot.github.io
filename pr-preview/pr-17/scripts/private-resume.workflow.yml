# Copy this file into benrobot/benrobot.github.io.private as
# .github/workflows/private-resume.yml
#
# This file only starts the build. The steps live in the public repository
# and are loaded from main, so later build changes do not need a commit here.
# Update this file only if the called workflow path or the resume-updated
# event name changes.

name: Private resume

on:
  repository_dispatch:
    types: [resume-updated]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: benrobot/benrobot.github.io/.github/workflows/private-resume-reusable.yml@main
